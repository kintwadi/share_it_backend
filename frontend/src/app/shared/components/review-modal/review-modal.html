<ng-container *ngIf="isOpen && item && currentUser">
  <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <h2 class="text-lg font-bold text-gray-900">{{ i18n.t('review.title') }}</h2>
        <button (click)="onClose()" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-200">
          <lucide-icon [img]="X" [size]="20"></lucide-icon>
        </button>
      </div>

      <div class="p-6 overflow-y-auto">
        <div *ngIf="error" class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-xl border border-red-100">
          {{ error }}
        </div>

        <div *ngIf="done" class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl flex items-start gap-3">
          <lucide-icon [img]="CheckCircle2" class="text-emerald-600 mt-0.5 shrink-0" [size]="18"></lucide-icon>
          <div class="text-sm">
            <div class="font-bold text-emerald-800">{{ i18n.t('review.thanks') }}</div>
            <div class="text-emerald-700 mt-1">{{ i18n.t('review.submitted') }}</div>
          </div>
        </div>

        <div *ngIf="!done" class="space-y-5">
          <div class="text-sm text-gray-600">
            {{ i18n.t('review.for') }} <span class="font-bold text-gray-900">{{ item.title }}</span>
          </div>

          <div>
            <div class="text-sm font-semibold text-gray-900 mb-2">{{ i18n.t('review.rating') }}</div>
            <div class="flex gap-2">
              <button *ngFor="let s of [1,2,3,4,5]" (click)="setRating(s)" class="w-10 h-10 rounded-xl border border-gray-200 hover:bg-gray-50 flex items-center justify-center">
                <lucide-icon [img]="Star" [size]="18" [ngClass]="rating >= s ? 'text-yellow-500' : 'text-gray-300'"></lucide-icon>
              </button>
            </div>
          </div>

          <div>
            <div class="text-sm font-semibold text-gray-900 mb-2">{{ i18n.t('review.comment') }}</div>
            <textarea [(ngModel)]="comment" rows="4" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" [placeholder]="i18n.t('review.comment_placeholder')"></textarea>
          </div>

          <button (click)="submit()" [disabled]="loading" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 rounded-xl disabled:opacity-50 flex items-center justify-center">
            <lucide-icon *ngIf="loading" [img]="Loader2" class="animate-spin mr-2" [size]="18"></lucide-icon>
            {{ i18n.t('review.submit') }}
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
