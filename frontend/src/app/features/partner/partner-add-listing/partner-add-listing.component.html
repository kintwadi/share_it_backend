<div class="max-w-3xl mx-auto px-4 py-8 space-y-6">
  <div class="flex items-center justify-between">
    <button (click)="router.navigate(['/partner/dashboard'])" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-gray-900">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      Back
    </button>
    <h1 class="text-xl font-bold text-gray-900">Add Partner Listing</h1>
  </div>

  <div *ngIf="loading" class="text-sm text-gray-500">Loading...</div>
  <div *ngIf="!loading && error" class="flex items-center justify-between gap-3 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3">
    <div>{{ error }}</div>
    <button type="button" (click)="loadPartners()" class="px-3 py-1.5 rounded-lg bg-white border border-red-200 text-red-700 font-semibold hover:bg-red-50">
      Retry
    </button>
  </div>

  <div *ngIf="!loading && !error && partners.length === 0" class="bg-amber-50 border border-amber-200 rounded-2xl p-5">
    <div class="text-amber-900 font-semibold">No partners found for your account.</div>
    <div class="text-sm text-amber-900/70 mt-2">You need at least one partner linked to your account before you can create partner listings.</div>
  </div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" class="bg-white border border-gray-200 rounded-2xl p-6 space-y-4">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Partner</label>
      <select formControlName="partnerId" [disabled]="partners.length === 0" class="w-full border border-gray-200 rounded-xl px-3 py-2">
        <option value="" disabled>{{ partners.length === 0 ? 'No partners available' : 'Select partner' }}</option>
        <option *ngFor="let p of partners" [value]="p.id">{{ p.name }}</option>
      </select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
        <input formControlName="title" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
        <input formControlName="category" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
      <textarea formControlName="description" rows="4" class="w-full border border-gray-200 rounded-xl px-3 py-2"></textarea>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Type</label>
        <select formControlName="type" class="w-full border border-gray-200 rounded-xl px-3 py-2">
          <option [ngValue]="ListingType.GOODS">GOODS</option>
          <option [ngValue]="ListingType.SKILL">SKILL</option>
          <option [ngValue]="ListingType.LEND">LEND</option>
          <option [ngValue]="ListingType.SELL">SELL</option>
          <option [ngValue]="ListingType.GIVE">GIVE</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Hourly Rate</label>
        <input type="number" formControlName="hourlyRate" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" formControlName="autoApprove" />
        Auto-approve requests
      </label>
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <input type="checkbox" formControlName="insuranceRequired" />
        Requires insurance
      </label>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Image</label>
      <div class="flex items-center gap-3">
        <input formControlName="imageUrl" class="w-full border border-gray-200 rounded-xl px-3 py-2" placeholder="Image URL" />
        <label class="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-900 text-white text-sm font-semibold cursor-pointer">
          <lucide-icon [img]="Upload" [size]="16"></lucide-icon>
          Upload
          <input type="file" class="hidden" accept="image/*" (change)="onUpload($any($event.target).files?.[0] || null)" />
        </label>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">City</label>
        <input formControlName="pickupLocationCity" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Zip</label>
        <input formControlName="pickupLocationZip" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Street</label>
        <input formControlName="pickupLocationStreet" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">House Number</label>
        <input formControlName="pickupLocationHouseNumber" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">Pickup Notes</label>
      <input formControlName="pickupLocationCustom" class="w-full border border-gray-200 rounded-xl px-3 py-2" />
    </div>

    <button type="submit" [disabled]="saving || form.invalid || partners.length === 0" class="w-full py-3 rounded-xl bg-gray-900 text-white font-semibold disabled:opacity-60">
      {{ saving ? 'Saving...' : 'Create Listing' }}
    </button>
  </form>
</div>
