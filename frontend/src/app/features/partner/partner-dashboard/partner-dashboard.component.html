<div class="max-w-6xl mx-auto px-4 py-8 space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Partner Dashboard</h1>
      <p class="text-sm text-gray-500">Manage partner-owned listings and requests.</p>
    </div>
    <div class="flex items-center gap-2">
      <a routerLink="/partner/requests" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50">
        <lucide-icon [img]="Inbox" [size]="16"></lucide-icon>
        Requests
      </a>
      <a [routerLink]="['/partner/requests']" [queryParams]="{ view: 'history' }" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50">
        <lucide-icon [img]="History" [size]="16"></lucide-icon>
        History
      </a>
      <a routerLink="/partner/settings" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50">
        <lucide-icon [img]="Settings" [size]="16"></lucide-icon>
        Settings
      </a>
      <button (click)="openSubmitForm()" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-gray-900 text-white text-sm font-semibold hover:bg-gray-800">
        <lucide-icon [img]="Plus" [size]="16"></lucide-icon>
        Submit Listing
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-sm text-gray-500">Loading...</div>
  <div *ngIf="!loading && error" class="flex items-center justify-between gap-3 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3">
    <div>{{ error }}</div>
    <button type="button" (click)="reload()" class="px-3 py-1.5 rounded-lg bg-white border border-red-200 text-red-700 font-semibold hover:bg-red-50">
      Retry
    </button>
  </div>

  <div *ngIf="!loading && partners.length === 0" class="bg-white border border-gray-200 rounded-2xl p-5">
    <div class="flex items-center gap-2 text-gray-900 font-semibold">
      <lucide-icon [img]="Building2" [size]="18"></lucide-icon>
      No partners found for your account.
    </div>
    <p class="text-sm text-gray-500 mt-2">Ask an admin to grant you partner access or use the backend partner registration endpoint.</p>
  </div>

  <div id="partner-submit-form" *ngIf="!loading && partners.length > 0 && showSubmitForm">
    <app-partner-submit-listing (submitted)="reload()"></app-partner-submit-listing>
  </div>

  <div *ngIf="!loading && listings.length > 0" class="space-y-3">
    <h2 class="text-lg font-bold text-gray-900">My Partner Listings</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <app-resource-card
        *ngFor="let listing of listings"
        [listing]="listing"
        (cardClick)="router.navigate(['/partner/listings/edit', listing.id])"
      ></app-resource-card>
    </div>
  </div>
</div>
