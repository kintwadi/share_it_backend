<div class="min-h-screen bg-gray-50 pt-24 pb-10">
  <div class="max-w-xl mx-auto px-4">
    <button type="button" class="back" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      {{ i18n.t('listing.back_to_listings') }}
    </button>

    <div class="panel">
      <div class="panel__head">
        <div class="icon">
          <lucide-icon [img]="Trash2" [size]="18"></lucide-icon>
        </div>
        <div>
          <div class="title">{{ i18n.t('dashboard.delete_listing_title') }}</div>
          <div class="subtitle" *ngIf="listing">{{ listing.title }}</div>
        </div>
      </div>

      <div class="panel__body">
        <div *ngIf="loading" class="state">
          <lucide-icon [img]="Loader2" [size]="18" class="spin"></lucide-icon>
          Loading…
        </div>

        <div *ngIf="!loading && error" class="error">
          <lucide-icon [img]="AlertTriangle" [size]="18"></lucide-icon>
          <div>{{ error }}</div>
        </div>

        <div *ngIf="!loading && listing" class="text">
          {{ i18n.t('dashboard.delete_listing_msg') }} "{{ listing.title }}"? {{ i18n.t('dashboard.delete_listing_cannot_undo') }}
        </div>
      </div>

      <div class="panel__foot">
        <button type="button" class="btn btn--secondary" (click)="back()">
          {{ i18n.t('common.cancel') }}
        </button>
        <button type="button" class="btn btn--danger" [disabled]="deleting || loading || !listing" (click)="confirmDelete()">
          <lucide-icon *ngIf="deleting" [img]="Loader2" [size]="16" class="spin"></lucide-icon>
          {{ i18n.t('dashboard.delete_cta') }}
        </button>
      </div>
    </div>
  </div>
</div>
