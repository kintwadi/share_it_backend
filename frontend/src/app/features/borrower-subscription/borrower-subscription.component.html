<div *ngIf="loading" class="borrower-subscription-page">
  <div class="borrower-subscription-shell borrower-subscription-shell--loading">
    <lucide-icon [img]="Loader2" [size]="30" class="animate-spin"></lucide-icon>
    <span>{{ i18n.t('borrowerSub.loading') }}</span>
  </div>
</div>

<div *ngIf="!loading && user" class="borrower-subscription-page" [class.borrower-subscription-page--standard]="layoutMode.isStandard()">
  <div class="borrower-subscription-shell">
    <button type="button" (click)="goBack()" class="borrower-subscription-back">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      <span>{{ i18n.t('borrowerSub.back_to_dashboard') }}</span>
    </button>

    <section class="borrower-subscription-panel">
      <div class="borrower-subscription-panel__header">
        <div class="borrower-subscription-panel__badge">
          <lucide-icon [img]="Shield" [size]="18"></lucide-icon>
          <span>{{ i18n.t('borrowerSub.badge') }}</span>
        </div>
        <h1 class="borrower-subscription-panel__title">{{ pageTitle }}</h1>
        <p class="borrower-subscription-panel__subtitle">{{ pageSubtitle }}</p>
      </div>

      <div *ngIf="error" class="borrower-subscription-alert borrower-subscription-alert--error">
        <lucide-icon [img]="AlertTriangle" [size]="16"></lucide-icon>
        <span>{{ error }}</span>
      </div>

      <div *ngIf="hasActiveSubscription" class="borrower-subscription-alert borrower-subscription-alert--success">
        <lucide-icon [img]="CheckCircle2" [size]="16"></lucide-icon>
        <span>{{ i18n.t('borrowerSub.active_notice') }}</span>
      </div>

      <div class="borrower-subscription-grid">
        <article class="borrower-subscription-card">
          <div class="borrower-subscription-card__label">{{ i18n.t('borrowerSub.plan_label') }}</div>
          <div class="borrower-subscription-card__value">{{ planSummary }}</div>
        </article>

        <article class="borrower-subscription-card">
          <div class="borrower-subscription-card__label">{{ i18n.t('borrowerSub.benefits_label') }}</div>
          <ul class="borrower-subscription-list">
            <li *ngFor="let item of benefitItems">{{ item }}</li>
          </ul>
        </article>
      </div>

      <div class="borrower-subscription-panel__actions">
        <button
          *ngIf="!hasActiveSubscription"
          type="button"
          class="borrower-subscription-btn borrower-subscription-btn--primary"
          (click)="startSubscription()"
          [disabled]="starting"
        >
          <lucide-icon *ngIf="starting" [img]="Loader2" [size]="16" class="animate-spin"></lucide-icon>
          <span>{{ starting ? i18n.t('borrowerSub.starting') : i18n.t('borrowerSub.subscribe') }}</span>
        </button>

        <button
          *ngIf="hasActiveSubscription"
          type="button"
          class="borrower-subscription-btn borrower-subscription-btn--primary"
          (click)="manageSubscription()"
        >
          {{ i18n.t('borrowerSub.manage') }}
        </button>

        <button type="button" class="borrower-subscription-btn borrower-subscription-btn--secondary" (click)="goBack()">
          {{ i18n.t('borrowerSub.return_to_dashboard') }}
        </button>
      </div>
    </section>
  </div>
</div>
