<ng-container *ngIf="layoutMode.isStandard(); else modernConfirmTemplate">
<div class="confirm-page-standard">
  <div class="confirm-page-standard__shell">
    <button type="button" class="back back-standard" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      {{ i18n.t('common.back') }}
    </button>

    <div *ngIf="loading" class="card card-standard center">
      <lucide-icon [img]="Loader2" [size]="26" class="spin"></lucide-icon>
      <div class="muted muted-standard">{{ i18n.t('common.loading') }}</div>
    </div>

    <div *ngIf="!loading" class="card card-standard">
      <div class="header header-standard">
        <div class="icon icon-standard" [ngClass]="icon">
          <lucide-icon [img]="icon === 'security' ? Shield : (icon === 'payment' ? CreditCard : (icon === 'device' ? Smartphone : AlertTriangle))" [size]="22"></lucide-icon>
        </div>
        <div>
          <div class="title title-standard">{{ title }}</div>
          <div class="subtitle subtitle-standard">{{ message }}</div>
        </div>
      </div>

      <div class="confirm-note-standard">
        <div class="confirm-note-standard__title">{{ i18n.t('settings.header.privacy_badge') }}</div>
        <div class="confirm-note-standard__text">{{ i18n.t('settings.header.privacy_hint') }}</div>
      </div>

      <div *ngIf="error" class="error error-standard">
        <lucide-icon [img]="AlertTriangle" [size]="16"></lucide-icon>
        <div>{{ error }}</div>
      </div>

      <div class="actions actions-standard">
        <button type="button" class="btn btn-standard-ghost" (click)="back()" [disabled]="confirming">{{ i18n.t('common.cancel') }}</button>
        <button type="button" class="btn btn-standard-danger" (click)="confirm()" [disabled]="confirming">
          <lucide-icon *ngIf="confirming" [img]="Loader2" [size]="16" class="spin"></lucide-icon>
          <span>{{ confirmLabel }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
</ng-container>

<ng-template #modernConfirmTemplate>
<div class="min-h-screen bg-gray-50 pt-24 pb-10">
  <div class="max-w-xl mx-auto px-4">
    <button type="button" class="back" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      {{ i18n.t('common.back') }}
    </button>

    <div *ngIf="loading" class="card center">
      <lucide-icon [img]="Loader2" [size]="26" class="spin"></lucide-icon>
      <div class="muted">{{ i18n.t('common.loading') }}</div>
    </div>

    <div *ngIf="!loading" class="card">
      <div class="header">
        <div class="icon" [ngClass]="icon">
          <lucide-icon [img]="icon === 'security' ? Shield : (icon === 'payment' ? CreditCard : (icon === 'device' ? Smartphone : AlertTriangle))" [size]="22"></lucide-icon>
        </div>
        <div>
          <div class="title">{{ title }}</div>
          <div class="subtitle">{{ message }}</div>
        </div>
      </div>

      <div *ngIf="error" class="error">
        <lucide-icon [img]="AlertTriangle" [size]="16"></lucide-icon>
        <div>{{ error }}</div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="back()" [disabled]="confirming">{{ i18n.t('common.cancel') }}</button>
        <button type="button" class="btn danger" (click)="confirm()" [disabled]="confirming">
          <lucide-icon *ngIf="confirming" [img]="Loader2" [size]="16" class="spin"></lucide-icon>
          <span>{{ confirmLabel }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
</ng-template>
