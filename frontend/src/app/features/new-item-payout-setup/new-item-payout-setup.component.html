<div class="min-h-screen bg-gray-50 pt-24 pb-10">
  <div class="max-w-xl mx-auto px-4">
    <button type="button" class="back" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      Back to listing
    </button>

    <div class="panel">
      <div class="panel__head">
        <div class="icon">
          <lucide-icon [img]="CreditCard" [size]="20"></lucide-icon>
        </div>
        <div>
          <div class="title">Set up payouts first</div>
          <div class="subtitle">
            Before you post a paid “Lend” listing, configure your linked account so you can receive payments.
          </div>
        </div>
      </div>

      <div class="panel__foot">
        <button type="button" class="btn btn--secondary" (click)="back()">
          {{ i18n.t('common.cancel') }}
        </button>
        <button type="button" class="btn btn--primary" (click)="managePayouts()">
          {{ i18n.t('payments.payouts.manage') }}
        </button>
      </div>
    </div>
  </div>
</div>
