<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
    <div class="p-6 border-b border-gray-100 bg-gray-50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gray-900 text-white flex items-center justify-center">
          <lucide-icon [img]="Building2" [size]="18"></lucide-icon>
        </div>
        <div>
          <div class="text-lg font-bold text-gray-900">{{ i18n.t('connect_partner.title') }}</div>
          <div class="text-xs text-gray-500">{{ i18n.t('connect_partner.subtitle') }}</div>
        </div>
      </div>
    </div>

    <div class="p-6 space-y-5">
      <div class="flex rounded-xl bg-gray-100 p-1">
        <button type="button" (click)="toggleMode(true)" class="flex-1 py-2 text-sm font-semibold rounded-lg" [ngClass]="isLogin ? 'bg-white shadow text-gray-900' : 'text-gray-600'">{{ i18n.t('connect_partner.login') }}</button>
        <button type="button" (click)="toggleMode(false)" class="flex-1 py-2 text-sm font-semibold rounded-lg" [ngClass]="!isLogin ? 'bg-white shadow text-gray-900' : 'text-gray-600'">{{ i18n.t('connect_partner.signup') }}</button>
      </div>

      <div *ngIf="error" class="p-3 bg-red-50 text-red-700 text-sm rounded-xl border border-red-100 flex gap-2">
        <lucide-icon [img]="AlertCircle" [size]="16" class="mt-0.5"></lucide-icon>
        <div>{{ error }}</div>
      </div>

      <form (ngSubmit)="handleSubmit()" class="space-y-4">
        <div *ngIf="isLogin">
          <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.email') }}</label>
          <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
            <lucide-icon [img]="Mail" [size]="16" class="text-gray-400"></lucide-icon>
            <input [(ngModel)]="email" name="email" type="email" class="w-full outline-none text-sm" />
          </div>
        </div>

        <div *ngIf="isLogin">
          <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.password') }}</label>
          <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
            <lucide-icon [img]="Lock" [size]="16" class="text-gray-400"></lucide-icon>
            <input [(ngModel)]="password" name="password" type="password" class="w-full outline-none text-sm" />
          </div>
        </div>

        <ng-container *ngIf="!isLogin">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_name') }}</label>
            <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
              <lucide-icon [img]="Building2" [size]="16" class="text-gray-400"></lucide-icon>
              <input [(ngModel)]="partnerName" name="partnerName" class="w-full outline-none text-sm" />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_email') }}</label>
              <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
                <lucide-icon [img]="Mail" [size]="16" class="text-gray-400"></lucide-icon>
                <input [(ngModel)]="partnerEmail" name="partnerEmail" type="email" class="w-full outline-none text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_password') }}</label>
              <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
                <lucide-icon [img]="Lock" [size]="16" class="text-gray-400"></lucide-icon>
                <input [(ngModel)]="partnerPassword" name="partnerPassword" type="password" class="w-full outline-none text-sm" />
              </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_phone') }}</label>
            <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
              <lucide-icon [img]="Phone" [size]="16" class="text-gray-400"></lucide-icon>
              <input [(ngModel)]="partnerPhone" name="partnerPhone" class="w-full outline-none text-sm" />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_city') }}</label>
              <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
                <lucide-icon [img]="MapPin" [size]="16" class="text-gray-400"></lucide-icon>
                <input [(ngModel)]="partnerCity" name="partnerCity" class="w-full outline-none text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.contact_person') }}</label>
              <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
                <lucide-icon [img]="UserIcon" [size]="16" class="text-gray-400"></lucide-icon>
                <input [(ngModel)]="contactPerson" name="contactPerson" class="w-full outline-none text-sm" />
              </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">{{ i18n.t('connect_partner.partner_address') }}</label>
            <div class="flex items-center gap-2 border border-gray-200 rounded-xl px-3 py-2 bg-white">
              <lucide-icon [img]="MapPin" [size]="16" class="text-gray-400"></lucide-icon>
              <input [(ngModel)]="partnerAddress" name="partnerAddress" class="w-full outline-none text-sm" />
            </div>
          </div>
        </ng-container>

        <button type="submit" [disabled]="isLoading" class="w-full py-3 rounded-xl bg-gray-900 text-white font-semibold disabled:opacity-60 flex items-center justify-center gap-2">
          <span>{{ isLoading ? i18n.t('connect_partner.please_wait') : (isLogin ? i18n.t('connect_partner.login') : i18n.t('connect_partner.create_account')) }}</span>
          <lucide-icon *ngIf="!isLoading" [img]="ArrowRight" [size]="16"></lucide-icon>
        </button>
      </form>

      <div class="text-xs text-gray-500 text-center">
        <a routerLink="/connect" class="hover:text-gray-900">{{ i18n.t('connect_partner.go_to_user_connect') }}</a>
      </div>
    </div>
  </div>
</div>
