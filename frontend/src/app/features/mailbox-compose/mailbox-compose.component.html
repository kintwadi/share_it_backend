<div class="min-h-screen bg-gray-50 pt-24 pb-10">
  <div class="max-w-3xl mx-auto px-4">
    <button type="button" class="back" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      {{ i18n.t('mailbox_compose.back') }}
    </button>

    <div class="panel">
      <div class="panel__head">
        <div class="title">{{ i18n.t('mailbox_compose.title') }}</div>
      </div>

      <div class="panel__body">
        <div *ngIf="error" class="error">
          <lucide-icon [img]="AlertTriangle" [size]="18"></lucide-icon>
          <div>{{ error }}</div>
        </div>

        <div class="field">
          <label class="label">{{ i18n.t('mailbox_compose.to_email') }}</label>
          <input
            [(ngModel)]="receiver"
            class="input"
            [placeholder]="i18n.t('mailbox_compose.to_email_placeholder')"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label class="label">{{ i18n.t('mailbox_compose.message') }}</label>
          <textarea
            [(ngModel)]="content"
            rows="10"
            class="textarea"
            [placeholder]="i18n.t('mailbox_compose.message_placeholder')"
          ></textarea>
        </div>
      </div>

      <div class="panel__foot">
        <button type="button" class="btn btn--secondary" (click)="back()">{{ i18n.t('common.cancel') }}</button>
        <button type="button" class="btn btn--primary" [disabled]="sending" (click)="send()">
          <lucide-icon [img]="SendIcon" [size]="16"></lucide-icon>
          {{ i18n.t('mailbox_compose.send') }}
        </button>
      </div>
    </div>
  </div>
</div>
