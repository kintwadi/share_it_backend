<div class="min-h-screen bg-gray-50 pt-24 pb-10">
  <div class="max-w-xl mx-auto px-4">
    <button type="button" class="back" (click)="back()">
      <lucide-icon [img]="ArrowLeft" [size]="16"></lucide-icon>
      {{ i18n.t('mailbox_delete.back') }}
    </button>

    <div class="panel">
      <div class="panel__head">
        <div class="icon">
          <lucide-icon [img]="TrashIcon" [size]="18"></lucide-icon>
        </div>
        <div class="title">{{ i18n.t('mailbox_delete.title') }}</div>
      </div>

      <div class="panel__body">
        <div *ngIf="error" class="error">
          <lucide-icon [img]="AlertTriangle" [size]="18"></lucide-icon>
          <div>{{ error }}</div>
        </div>

        <div class="text">
          {{ i18n.t('mailbox_delete.confirm') }}
        </div>
      </div>

      <div class="panel__foot">
        <button type="button" class="btn btn--secondary" (click)="back()">{{ i18n.t('common.cancel') }}</button>
        <button type="button" class="btn btn--danger" [disabled]="deleting" (click)="confirmDelete()">{{ i18n.t('common.delete') }}</button>
      </div>
    </div>
  </div>
</div>
