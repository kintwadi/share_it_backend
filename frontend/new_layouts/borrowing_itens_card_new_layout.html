<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>v24pool — Active Borrows</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.0/index.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f9fc;
    --surface: #ffffff;
    --border: #e6eaf0;
    --border-strong: #d3dae4;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-light: #ccfbf1;
    --accent-bg: #f0fdfa;
    --success: #10b981;
    --success-bg: #ecfdf5;
    --success-border: #d1fae5;
    --warning: #d97706;
    --warning-bg: #fffbeb;
    --warning-border: #fde68a;
    --warning-text: #92400e;
    --danger: #ef4444;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
    --orange: #ea580c;
    --orange-hover: #c2410c;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: rgba(255,255,255,0.85);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav-link {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 8px;
    color: var(--text-muted); text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: all 0.2s ease;
  }
  .nav-link:hover { background: var(--bg); color: var(--text); }
  .nav-link.active { background: var(--accent-light); color: var(--accent); }
  .nav-link svg { width: 18px; height: 18px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text-muted);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .user-menu {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 12px 4px 4px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; transition: all 0.2s ease;
  }
  .user-menu:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .user-avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .user-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .chevron { color: var(--text-subtle); width: 14px; height: 14px; }

  /* Main */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* Page header */
  .page-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }
  .page-icon {
    width: 48px; height: 48px;
    background: var(--warning-bg);
    border: 1px solid var(--warning-border);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--warning);
    flex-shrink: 0;
  }
  .page-icon svg { width: 24px; height: 24px; }
  .page-title-wrap h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .page-title-wrap .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .count-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .count-badge .dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Filters bar */
  .filters-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .tab:hover:not(.active) { color: var(--text); }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-width: 260px;
    transition: all 0.2s ease;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
  }
  .search-box svg { width: 16px; height: 16px; color: var(--text-subtle); flex-shrink: 0; }
  .search-box input {
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: transparent;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--text-subtle); }

  /* Table card */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .table-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
  }
  .table-header-bar h3 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .table-header-bar .meta {
    font-size: 12px;
    color: var(--text-subtle);
  }

  /* Table */
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead { background: var(--bg); }
  th {
    text-align: left;
    padding: 12px 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }
  tbody tr {
    transition: background 0.15s ease;
  }
  tbody tr:hover { background: var(--bg); }
  tbody tr:last-child td { border-bottom: none; }

  /* Item cell */
  .item-cell {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .item-thumb {
    width: 56px; height: 56px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .item-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }
  .item-ref {
    font-size: 11px;
    color: var(--text-subtle);
    font-family: 'SF Mono', Menlo, monospace;
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
  }

  /* Owner cell */
  .owner-cell {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .owner-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--surface);
    box-shadow: var(--shadow-sm);
  }
  .owner-name {
    font-size: 13px;
    font-weight: 600;
  }
  .owner-label {
    font-size: 11px;
    color: var(--text-subtle);
  }

  /* Status badge */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-badge.ready {
    background: var(--warning-bg);
    color: var(--warning-text);
    border: 1px solid var(--warning-border);
  }
  .status-badge.active {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid var(--success-border);
  }
  .status-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }

  /* Location cell */
  .location-cell {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    max-width: 220px;
  }
  .location-cell svg {
    width: 14px; height: 14px;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* Actions cell */
  .actions-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
  }
  .btn-primary:hover {
    background: var(--orange-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(234, 88, 12, 0.35);
  }
  .btn-primary svg { width: 14px; height: 14px; }
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-secondary:hover {
    border-color: var(--border-strong);
    background: var(--bg);
  }
  .btn-secondary svg { width: 14px; height: 14px; }
  .btn-danger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 12px;
    background: var(--surface);
    color: var(--danger);
    border: 1px solid var(--danger-border);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-danger:hover {
    background: var(--danger-bg);
    border-color: var(--danger);
  }
  .btn-danger svg { width: 14px; height: 14px; }

  /* More menu */
  .more-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .more-btn:hover {
    border-color: var(--border-strong);
    color: var(--text);
    background: var(--bg);
  }
  .more-btn svg { width: 16px; height: 16px; }

  /* Empty state */
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state svg {
    width: 48px; height: 48px;
    color: var(--text-subtle);
    margin-bottom: 12px;
  }
  .empty-state h4 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .empty-state p { font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast svg { width: 18px; height: 18px; color: var(--success); }

  /* Responsive */
  @media (max-width: 900px) {
    .nav-link span { display: none; }
    .search-box { min-width: 200px; }
  }
  @media (max-width: 700px) {
    .header-inner { padding: 0 16px; }
    .main { padding: 20px 16px 60px; }
    .page-title-wrap h1 { font-size: 22px; }
    .user-name { display: none; }
    .filters-bar { flex-direction: column; align-items: stretch; }
    .search-box { min-width: 100%; }
    td, th { padding: 14px 12px; }
    .actions-cell { flex-direction: column; align-items: stretch; }
    .actions-cell button { justify-content: center; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">v24pool<span class="logo-dot"></span></div>
    <nav class="nav">
      <a href="#" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Discover</span>
      </a>
      <a href="#" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Messages</span>
      </a>
    </nav>
    <div class="header-right">
      <button class="lang-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        EN
      </button>
      <div class="user-menu">
        <img src="https://image.qwenlm.ai/public_source/26619a1d-b784-4009-9f28-47e192b7ef0c/12730b25d-f9ed-4005-a53c-cd05cd32b3ab.png" alt="Pedro" class="user-avatar-sm" />
        <span class="user-name">Pedro</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <!-- Page header -->
  <div class="page-header">
    <div class="page-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="page-title-wrap">
      <h1>Active borrows</h1>
      <div class="subtitle">
        Items you are currently borrowing
        <span class="count-badge"><span class="dot"></span> 1 active</span>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="tabs">
      <button class="tab active">All (1)</button>
      <button class="tab">Ready for pickup</button>
      <button class="tab">In transit</button>
      <button class="tab">Completed</button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search by name or reference..." id="searchInput" oninput="filterTable()" />
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header-bar">
      <div>
        <h3>Borrowing overview</h3>
        <div class="meta">Track your active rentals and manage returns</div>
      </div>
      <button class="btn-secondary" onclick="showToast(' Report exported')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Owner</th>
            <th>Reference</th>
            <th>Status</th>
            <th>Pickup location</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="borrowTable">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg">Done</span>
</div>

<script>
  const borrows = [
    {
      id: 1,
      name: 'bike',
      image: 'https://image.qwenlm.ai/public_source/26619a1d-b784-4009-9f28-47e192b7ef0c/1ad7ac20b-cc38-4afa-907e-ee4b3db297a0.png',
      owner: 'Lender',
      ownerAvatar: 'https://image.qwenlm.ai/public_source/26619a1d-b784-4009-9f28-47e192b7ef0c/12730b25d-f9ed-4005-a53c-cd05cd32b3ab.png',
      ref: '41883222',
      status: 'Ready for pickup',
      statusClass: 'ready',
      location: 'Frankfurterstr 2455, Frankfurt'
    }
  ];

  function renderTable(data) {
    const tbody = document.getElementById('borrowTable');
    if (data.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
              <h4>No borrows found</h4>
              <p>Try adjusting your search or filters</p>
            </div>
          </td>
        </tr>
      `;
      return;
    }
    tbody.innerHTML = data.map(b => `
      <tr data-id="${b.id}">
        <td>
          <div class="item-cell">
            <img src="${b.image}" alt="${b.name}" class="item-thumb" />
            <div>
              <div class="item-name">${b.name}</div>
              <span class="item-ref">#${b.ref}</span>
            </div>
          </div>
        </td>
        <td>
          <div class="owner-cell">
            <img src="${b.ownerAvatar}" alt="${b.owner}" class="owner-avatar" />
            <div>
              <div class="owner-name">${b.owner}</div>
              <div class="owner-label">Owner</div>
            </div>
          </div>
        </td>
        <td>
          <span class="item-ref">${b.ref}</span>
        </td>
        <td>
          <span class="status-badge ${b.statusClass}">
            <span class="dot"></span>
            ${b.status}
          </span>
        </td>
        <td>
          <div class="location-cell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>${b.location}</span>
          </div>
        </td>
        <td>
          <div class="actions-cell" style="justify-content:flex-end;">
            <button class="btn-primary" onclick="startReturn('${b.name}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              Start return
            </button>
            <button class="btn-secondary" onclick="showToast('Opening overview for ${b.name}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Overview
            </button>
            <button class="btn-danger" onclick="showToast('Report submitted for ${b.name}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              Report
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = borrows.filter(b =>
      b.name.toLowerCase().includes(query) ||
      b.ref.includes(query) ||
      b.owner.toLowerCase().includes(query) ||
      b.location.toLowerCase().includes(query)
    );
    renderTable(filtered);
  }

  function startReturn(name) {
    showToast(`🔄 Return process started for "${name}"`);
  }

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showToast(`Filter: ${tab.textContent}`);
    });
  });

  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  renderTable(borrows);
</script>

</body>
</html>
