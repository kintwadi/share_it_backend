# Port and SSL Activation
server.port=443
server.ssl.enabled=true

# External Keystore Location
# server.ssl.key-store=file:/etc/ssl/certs/keystore.p12
server.ssl.key-store=classpath:keystore.p12
security.keystore.password=${SSL_PASSWORD}
server.ssl.key-store-password=${security.keystore.password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# Hardening Protocols and Ciphers (Prioritizing TLS 1.3)
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
server.http2.enabled=true

server.address=0.0.0.0
server.servlet.context-path=/shareit
spring.application.name=nearshare-back-end

# PostgreSQL Configuration (REQUIRED for production)
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Disable H2 auto-configuration only - keep JPA and DataSource intact
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Hikari connection pool configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false
security.jwt.validity-ms=604800000
security.jwt.access-token.alias=${KEYSTORE_ACCESS_TOKEN_ALIAS}
security.jwt.access-token.password=${KEYSTORE_ACCESS_TOKEN_PW}
security.jwt.refresh-token.alias=${KEYSTORE_REFRESH_TOKEN_ALIAS}
security.jwt.refresh-token.password=${KEYSTORE_REFRESH_TOKEN_PW}

# Email Configuration (for password recovery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
springdoc.api-docs.path=/v3/api-docs
spring.mvc.cors.allowed-origins=http://localhost:3000,http://localhost:4201,http://localhost:3001,https://localhost:4200,https://127.0.0.1:4200,http://127.0.0.1:5173,http://127.0.0.1:5174,https://share-it-client.onrender.com
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=Authorization,Cache-Control,Content-Type
spring.mvc.cors.allow-credentials=true
app.frontend.baseUrl=${FRONTEND_BASE_URL}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

#stripe listen --forward-to http://localhost:8081/shareit/api/payments/webhook

#stripe listen --forward-to https://localhost:443/shareit/api/payments/webhook


application.storage.type=R2
aws.region=eu-central-1
aws.s3.bucket=propertiesmedias
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.publicRead=true
nearshare.allowAdminToggle=true

# Cloudflare R2 Configuration
r2.account.id=${R2_ACCOUNT_ID}
r2.access.key.id=${R2_ACCESS_KEY_ID}
r2.secret.access.key=${R2_SECRET_ACCESS_KEY}
r2.bucket.name=${R2_BUCKET_NAME}
r2.endpoint=${R2_ENDPOINT}
r2.region=auto
r2.public.url=${R2_PUBLIC_URL}

# Application Settings
settings.returns.qr.enabled=true
settings.returns.manual.enabled=true
settings.returns.dispute.enabled=true
image.max.size.mb=5
allowed.image.types=jpg,jpeg,png,gif,webp

#stripe
STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

subscription.plus.stripe_price_id=${SUBSCRIPTION_PLUS_STRIPE_PRICE_ID}
subscription.plus.trial_days=14
subscription.pro.stripe_price_id=${SUBSCRIPTION_PRO_STRIPE_PRICE_ID}


