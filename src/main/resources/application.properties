##server.port=8081  ## must be enabled when running on Render
server.servlet.context-path=/shareit
spring.application.name=nearshare-back-end

# External Keystore Location
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:springboot}

security.jwt.secret=${JWT_SECRET:}
security.jwt.keystore.remote-location=${JWT_KEYSTORE_REMOTE:}
security.jwt.keystore.location=${JWT_KEYSTORE_LOCATION:}
security.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:${SSL_PASSWORD:}}
security.jwt.keystore.type=${JWT_KEYSTORE_TYPE:PKCS12}

## TLS Configuration Not needed when running on Render
# Hardening Protocols and Ciphers (Prioritizing TLS 1.3)
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
# Port and SSL Activation
server.port=${PORT:8081}
server.ssl.enabled=${SSL_ENABLED:false}
settings.http.enabled=${SETTINGS_HTTP_ENABLED:true}
settings.http.port=${SETTINGS_HTTP_PORT:80}
settings.http.redirect-to-https.enabled=${SETTINGS_HTTP_REDIRECT_TO_HTTPS_ENABLED:false}
server.http2.enabled=true

server.address=0.0.0.0

# Geolocation (FreeIPAPI)
geolocation.enabled=${GEOLOCATION_ENABLED:true}
geolocation.dev-ip=${GEOLOCATION_DEV_IP:}
geolocation.cache-ttl-seconds=${GEOLOCATION_CACHE_TTL_SECONDS:900}
geolocation.freeipapi.base_url=${GEOLOCATION_BASE_URL:https://free.freeipapi.com/api/json/}


# PostgreSQL Configuration (REQUIRED for production)
enable.db.type=${DB_TYPE:}
enable.sqlite.r2.stream.for.render=${SQLITE_R2_STREAM_FOR_RENDER:false}
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Disable H2 auto-configuration only - keep JPA and DataSource intact
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Hikari connection pool configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
security.jwt.validity-ms=604800000
security.jwt.access-token.alias=${KEYSTORE_ACCESS_TOKEN_ALIAS:}
security.jwt.access-token.password=${KEYSTORE_ACCESS_TOKEN_PW:}
security.jwt.refresh-token.alias=${KEYSTORE_REFRESH_TOKEN_ALIAS:}
security.jwt.refresh-token.password=${KEYSTORE_REFRESH_TOKEN_PW:}

# Email Configuration (for password recovery)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
springdoc.api-docs.path=/v3/api-docs
spring.mvc.cors.allowed-origins=http://localhost:3000,http://localhost:4201,http://localhost:3001,https://localhost:4200,https://127.0.0.1:4200,http://127.0.0.1:5173,http://127.0.0.1:5174,https://share-it-client.onrender.com
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=Authorization,Cache-Control,Content-Type
spring.mvc.cors.allow-credentials=true
security.cors.allowed-origin-patterns=${LOCAL_HOST:http://localhost:*,https://localhost:*},${LOCAL_127:http://127.0.0.1:*,https://127.0.0.1:*},${REMOTE_RENDE:https://share-it-client.onrender.com}
app.frontend.baseUrl=${FRONTEND_BASE_URL:}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1

application.storage.type=R2
aws.region=eu-central-1
aws.s3.bucket=propertiesmedias
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.publicRead=true

# Admin
security.admin.signup.secret=${ADMIN_SIGNUP_SECRET:}

# Cloudflare R2 Configuration
r2.account.id=${R2_ACCOUNT_ID:}
r2.access.key.id=${R2_ACCESS_KEY_ID:}
r2.secret.access.key=${R2_SECRET_ACCESS_KEY:}
r2.bucket.name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.region=auto
r2.public.url=${R2_PUBLIC_URL:}


# or: Manual
# or: Dispute
# or: ANY
# or: QRCode
settings.return.mode=Manual
settings.returns.qr.enabled=false
settings.returns.manual.enabled=true
settings.returns.dispute.enabled=true
settings.enable.enterprise=false
settings.enable.subscription=false
settings.enable.sell=false
settings.service.fee=2.99
image.max.size.mb=5
allowed.image.types=jpg,jpeg,png,gif,webp

# Insurance Module
settings.insurance.enabled=true
insurance.currency=USD
insurance.quote-validity-minutes=30
insurance.zip-adjustment.prefix=9
insurance.zip-adjustment.multiplier=1.15
insurance.rules.basic.percent=0.05
insurance.rules.basic.min=5
insurance.rules.basic.max=50
insurance.rules.premium.percent=0.10
insurance.rules.premium.min=10
insurance.rules.premium.max=100
insurance.rules.theft_protection.percent=0.08
insurance.rules.theft_protection.min=8
insurance.rules.theft_protection.max=80
insurance.rules.extended_warranty.percent=0.03
insurance.rules.extended_warranty.min=3
insurance.rules.extended_warranty.max=30

#stripe
STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:}
STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:}
STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:}

subscription.currency=EUR
subscription.plus.monthly_amount_cents=499
subscription.plus.stripe_price_id=${SUBSCRIPTION_PLUS_STRIPE_PRICE_ID:}
subscription.plus.trial_days=14
subscription.pro.stripe_price_id=${SUBSCRIPTION_PRO_STRIPE_PRICE_ID:}


