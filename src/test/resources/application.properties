spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
seeding.enabled=false
spring.main.allow-bean-definition-overriding=true

# Mock AWS/R2
aws.region=eu-central-1
aws.s3.bucket=test-bucket
aws.accessKeyId=test-key
aws.secretAccessKey=test-secret
aws.s3.publicRead=true

r2.account.id=test-account
r2.access.key.id=test-key
r2.secret.access.key=test-secret
r2.bucket.name=test-bucket
r2.endpoint=https://test.r2.cloudflarestorage.com
r2.public.url=https://test.r2.dev

application.storage.type=S3

# Mock Stripe
STRIPE_PUBLIC_KEY=test_public_key
STRIPE_SECRET_KEY=test_secret_key
STRIPE_WEBHOOK_SECRET=test_webhook_secret
subscription.plus.stripe_price_id=price_plus
subscription.pro.stripe_price_id=price_pro

# Other
security.jwt.secret=testsecretkey12345678901234567890123456789012
security.jwt.validity-ms=3600000
security.encryption.key=1234567890123456
security.cors.allowed-origin-patterns=http://localhost:*
spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=Authorization,Cache-Control,Content-Type
spring.mvc.cors.allow-credentials=true
spring.mail.username=test
spring.mail.password=test
