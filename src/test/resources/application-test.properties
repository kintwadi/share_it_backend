enable.db.type=h2
spring.datasource.url=jdbc:h2:mem:vicinity24_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
security.jwt.validity-ms=604800000
security.cors.allowed-origin-patterns=http://localhost:*
security.encryption.key=0123456789abcdef0123456789abcdef
aws.region=us-east-1
aws.s3.bucket=test-bucket
spring.mvc.cors.allowed-origins=http://localhost:4200
application.storage.type=S3
