<section class="checkout">
  <div class="summary">
    <p class="eyebrow">Bike Checkout</p>
    <h1>Finalize your {{ plan | titlecase }} subscription</h1>
    <p>This isolated frontend calls the existing checkout backend without relying on the main marketplace UI.</p>

    <div class="fact">
      <span>Signed in as</span>
      <strong>{{ user?.email }}</strong>
    </div>

    <div class="fact">
      <span>Plan</span>
      <strong>{{ plan | titlecase }}</strong>
    </div>

    <button type="button" (click)="startCheckout()" [disabled]="loading">
      {{ loading ? 'Creating checkout session...' : 'Continue to Stripe checkout' }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>
    <a routerLink="/subscription">Back to subscription plans</a>
  </div>
</section>
