<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Password Recovery</p>
    <h1>Recover your bike account</h1>
    <p class="copy">Reset access without leaving the dedicated bike storefront.</p>

    <form class="auth-form" *ngIf="step === 1" (ngSubmit)="sendCode()">
      <label>
        <span>Email</span>
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>
      <button type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send recovery code' }}</button>
    </form>

    <form class="auth-form" *ngIf="step === 2" (ngSubmit)="verifyCode()">
      <label>
        <span>Recovery code</span>
        <input type="text" name="code" [(ngModel)]="code" maxlength="4" required />
      </label>
      <button type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Verify code' }}</button>
    </form>

    <form class="auth-form" *ngIf="step === 3" (ngSubmit)="resetPassword()">
      <label>
        <span>New password</span>
        <input type="password" name="newPassword" [(ngModel)]="newPassword" minlength="6" required />
      </label>
      <button type="submit" [disabled]="loading">{{ loading ? 'Updating...' : 'Reset password' }}</button>
    </form>

    <div class="auth-form" *ngIf="step === 4">
      <a class="button-link" routerLink="/login">Go to login</a>
    </div>

    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>
  </div>
</section>
