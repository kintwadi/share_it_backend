version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vicinity24-core-api
    environment:
      PORT: 8080
      SSL_ENABLED: "false"
      SETTINGS_HTTP_ENABLED: "false"
      DB_TYPE: ${DB_TYPE:-}
      SETTING_USE_DEFAULT_DATABASE: ${SETTING_USE_DEFAULT_DATABASE:-true}
      TENANT_HEADER_NAME: ${TENANT_HEADER_NAME:-X-Tenant-ID}
      TENANT_DEFAULT_ID: ${TENANT_DEFAULT_ID:-default}
      TENANT_DEFAULT_DB_URL: ${TENANT_DEFAULT_DB_URL}
      TENANT_DEFAULT_DB_USERNAME: ${TENANT_DEFAULT_DB_USERNAME}
      TENANT_DEFAULT_DB_PASSWORD: ${TENANT_DEFAULT_DB_PASSWORD}
      TENANT_DEFAULT_DB_DRIVER: ${TENANT_DEFAULT_DB_DRIVER:-org.postgresql.Driver}
      TENANT_A_DB_URL: ${TENANT_A_DB_URL:-}
      TENANT_A_DB_USERNAME: ${TENANT_A_DB_USERNAME:-}
      TENANT_A_DB_PASSWORD: ${TENANT_A_DB_PASSWORD:-}
      TENANT_A_DB_DRIVER: ${TENANT_A_DB_DRIVER:-org.postgresql.Driver}
      TENANT_B_DB_URL: ${TENANT_B_DB_URL:-}
      TENANT_B_DB_USERNAME: ${TENANT_B_DB_USERNAME:-}
      TENANT_B_DB_PASSWORD: ${TENANT_B_DB_PASSWORD:-}
      TENANT_B_DB_DRIVER: ${TENANT_B_DB_DRIVER:-org.postgresql.Driver}
      SSL_PASSWORD: ${SSL_PASSWORD}
      KEYSTORE_ACCESS_TOKEN_ALIAS: ${KEYSTORE_ACCESS_TOKEN_ALIAS}
      KEYSTORE_ACCESS_TOKEN_PW: ${KEYSTORE_ACCESS_TOKEN_PW}
      KEYSTORE_REFRESH_TOKEN_ALIAS: ${KEYSTORE_REFRESH_TOKEN_ALIAS}
      KEYSTORE_REFRESH_TOKEN_PW: ${KEYSTORE_REFRESH_TOKEN_PW}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SQLITE_R2_STREAM_FOR_RENDER: ${SQLITE_R2_STREAM_FOR_RENDER:-false}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/data/vicinity24.sqlite}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_PATH: ${LITESTREAM_PATH:-production}
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
    networks:
      - vicinity24-network
    restart: unless-stopped

networks:
  vicinity24-network:
    driver: bridge
