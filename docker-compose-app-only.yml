version: '3.8'

services:
  # Spring Boot Application Only (without PostgreSQL)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vicinity24-core-api
    environment:
      PORT: 8080
      SSL_ENABLED: "false"
      SETTINGS_HTTP_ENABLED: "false"
      DB_TYPE: ${DB_TYPE:-}
      DB_URL: ${DB_URL}
      DB_DRIVER: ${DB_DRIVER:-}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SSL_PASSWORD: ${SSL_PASSWORD}
      KEYSTORE_ACCESS_TOKEN_ALIAS: ${KEYSTORE_ACCESS_TOKEN_ALIAS}
      KEYSTORE_ACCESS_TOKEN_PW: ${KEYSTORE_ACCESS_TOKEN_PW}
      KEYSTORE_REFRESH_TOKEN_ALIAS: ${KEYSTORE_REFRESH_TOKEN_ALIAS}
      KEYSTORE_REFRESH_TOKEN_PW: ${KEYSTORE_REFRESH_TOKEN_PW}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SQLITE_R2_STREAM_FOR_RENDER: ${SQLITE_R2_STREAM_FOR_RENDER:-false}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/data/vicinity24.sqlite}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_PATH: ${LITESTREAM_PATH:-production}
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped

networks:
  vicinity24-network:
    driver: bridge
